
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Вход в Smart University">
  <title>Вход | Smart University</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-xl sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span class="brand-mark">S</span>SMART<span class="gradient-text">UNIVERSITY</span>
    </a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-xl-center gap-xl-1">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="faculties.html">Факультеты</a></li>
        <li class="nav-item"><a class="nav-link" href="programs.html">Программы</a></li>
        <li class="nav-item"><a class="nav-link" href="teachers.html">Преподаватели</a></li>
        <li class="nav-item"><a class="nav-link" href="news.html">Новости</a></li>
        <li class="nav-item"><a class="nav-link" href="schedule.html">Расписание</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Кабинет</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="auth-wrapper">

      <div class="auth-card surface">
        <div class="text-center mb-4">
          <div class="brand-mark auth-mark">S</div>
          <div class="eyebrow mt-3">Welcome back</div>
          <h2>Вход в систему</h2>
          <p class="muted">
            Войди в свой аккаунт Smart University.
          </p>
        </div>

        <form id="loginForm">

          <label for="loginEmail" class="form-label">Электронная почта</label>
          <input
            type="email"
            id="loginEmail"
            class="form-control mb-3"
            placeholder="student@example.com"
            required
          >

          <label for="loginPassword" class="form-label">Пароль</label>
          <input
            type="password"
            id="loginPassword"
            class="form-control mb-3"
            placeholder="Введите пароль"
            required
            minlength="6"
          >

          <div class="d-flex justify-content-between align-items-center mb-4">
            <label class="form-check-label small">
              <input type="checkbox" id="rememberMe" class="form-check-input">
              Запомнить меня
            </label>
            <a href="register.html" class="small-link">Регистрация</a>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Войти в аккаунт
          </button>

          <div id="loginMessage" class="mt-3 small text-center"></div>

        </form>

        <div class="text-center mt-4">
          <a href="index.html" class="small-link">← Вернуться на главную</a>
        </div>
      </div>

    </div>
  </div>
</main>

<footer class="footer">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>© 2026 SMART UNIVERSITY · Digital Campus</span>
    <span>Образование. Технологии. Будущее.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
